[project]
name = "bsafe"
version = "0.1.0"
description = "Censor NSFW content on your macOS screen"
requires-python = ">= 3.14"
dependencies = ["nudenet", "opencv-python-headless"]

[project.scripts]
bsafe = "bsafe.cli:main"

[project.optional-dependencies]
erax = ["ultralytics"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"
